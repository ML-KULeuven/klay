[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "klaycircuits"
version = "0.1.2"
description = "Arithmetic circuits on the GPU"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy"]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jaron Maene" },
    { name = "Vincent Derkinderen" },
    { name = "Pedro Zuidberg Dos Martires" }
]

[project.optional-dependencies]
torch = ["torch"]
jax = ["jax"]


[project.urls]
Homepage = "https://github.com/ML-KULeuven/klay"


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
# (pins default behaviour to the minimum version in build-system.requires)
minimum-version = "build-system.requires"
# cmake.build-type = "Debug"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

wheel.packages = ["src/klay"]

# Include CMakeLists.txt in source distribution
sdist.include = ["CMakeLists.txt"]

#[tool.cibuildwheel]
## Necessary to see build output from the actual compilation
#build-verbosity = 1
#
## Run pytest to ensure that the package was correctly built
#test-command = "pytest {project}/tests"
#test-requires = "pytest"
#
# Needed for full C++17 support
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.pytest.ini_options]
pythonpath = ["."]
