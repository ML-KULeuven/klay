name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v2
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.3
        env:
          CIBW_TEST_REQUIRES: pytest torch==2.14.1 pysdd==1.0.6
          CIBW_TEST_COMMAND: "pytest {project}/tests"
          CIBW_SKIP: cp313-* cp314-* cp315* *i686 *ppc64le *s390x *win32* *musllinux*
          CIBW_TEST_SKIP: cp311-macosx_x86_64 cp312-macosx_x86_64
          # cibuildwheel 4 repairs Windows wheels with delvewheel by default, which fails on
          # klay.dll (shipped inside the wheel, not on PATH). Keep the v3 behaviour: no repair.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Prepare source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build
        run: |
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-source
          path: dist/*.tar.gz

  upload_wheels:
    name: Upload wheels to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/klaycircuits
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
